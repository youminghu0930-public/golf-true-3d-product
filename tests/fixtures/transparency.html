<!doctype html><meta charset="utf-8"><title>Transparency depth regression</title><pre id="result">Running GPU checks…</pre>
<script type="module">
import * as THREE from '/materials/projects/pose-information-extraction/vendor/three/three.module.js';
import {createDepthCompositor} from '/depth-compositor.js';
const renderer=new THREE.WebGLRenderer(),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);
renderer.setSize(64,64);renderer.toneMapping=THREE.NoToneMapping;camera.position.z=5;scene.background=new THREE.Color('white');
const plane=(color,z)=>{const mesh=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.5,depthWrite:false}));mesh.position.z=z;scene.add(mesh);return mesh;};
const red=plane('red',1),blue=plane('blue',0),compositor=createDepthCompositor(renderer),target=new THREE.WebGLRenderTarget(64,64),pixel=new Uint8Array(4),results=[];
function check(name,expected){renderer.setRenderTarget(target);compositor.render(scene,camera);renderer.readRenderTargetPixels(target,32,32,1,1,pixel);const pass=expected.every((value,i)=>Math.abs(value-pixel[i])<=3);results.push({name,pass,pixel:[...pixel],expected});}
check('front red over back blue',[191,64,128]);
red.renderOrder=-100;blue.renderOrder=100;check('draw order cannot change the spatial blend',[191,64,128]);
blue.position.z=2;check('moving blue in front reverses the blend',[128,64,191]);
const opaque=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({color:'#00ff00'}));opaque.position.z=3;scene.add(opaque);check('solid foreground hides all transparent layers',[0,255,0]);
scene.remove(opaque);red.position.z=blue.position.z=0;red.rotation.y=.6;blue.rotation.y=-.6;
renderer.setRenderTarget(target);compositor.render(scene,camera);
const left=new Uint8Array(4),right=new Uint8Array(4);renderer.readRenderTargetPixels(target,16,32,1,1,left);renderer.readRenderTargetPixels(target,48,32,1,1,right);
results.push({name:'intersecting planes reverse front/back order across the image',pass:(left[0]-left[2])*(right[0]-right[2])<0,left:[...left],right:[...right]});
red.position.z=blue.position.z=0;red.rotation.y=blue.rotation.y=.6;red.renderOrder=16;blue.renderOrder=15;
renderer.setRenderTarget(target);compositor.render(scene,camera);
const samples=[];for(let x=10;x<=54;x+=2){const sample=new Uint8Array(4);renderer.readRenderTargetPixels(target,x,32,1,1,sample);samples.push([...sample]);}
results.push({name:'coplanar fills stay uniform across the tilted plane',pass:samples.every(sample=>sample.slice(0,3).every((value,i)=>Math.abs(value-[191,64,128][i])<=3)),samples});
document.querySelector('#result').textContent=JSON.stringify({pass:results.every(r=>r.pass),results},null,2);document.body.append(renderer.domElement);
</script>
